[project]
name = "zotero-core"
version = "0.4.0"
description = "The one place that knows what a local Zotero library is: gated CRUD over a read layer that owns every Zotero SQL query."
requires-python = ">=3.10"
# Still zero. The sqlite adapters are stdlib sqlite3; both write transports are stdlib
# urllib + json. That is load-bearing, not incidental: `omni-rag` imports the read path
# inside its ARC entrypoints, so an async runtime pulled in by a tag verb is a real cost.
# ⚠ This comment used to justify the rule by claiming `calibre-zotero-jump/ui.py` vendors
# `transports/cookjohn.py` verbatim. It does NOT (checked 2026-08-19): its build.sh zips
# three files, none of them cookjohn, and ui.py is an independent reimplementation.
dependencies = []

[project.optional-dependencies]
mcp = [
  # <2 deliberately. mcp 2.0.0 is a different API: no `@server.list_tools()` decorator
  # and no `mcp.server.fastmcp`. Both adapters target 1.x, and an unpinned `>=1.0.0`
  # once resolved 2.0.0 and crashed the server at import with `'Server' object has no
  # attribute 'list_tools'` -- which is how the read adapter sat broken long enough
  # never to be registered and never noticed. calibre-mcp pins the same way for the
  # same reason. Revisit only by porting both adapters.
  #
  # This pin used to exist TWICE, in two pyprojects, with two copies of this comment.
  # Collapsing that was part of the point of merging.
  "mcp>=1.26.0,<2",
]

[project.scripts]
zotero-core = "zotero_core.interfaces.cli:main"
# ONE server: reads, gated writes and paper saving. `--read-only` serves the reads alone,
# for a context that must not write -- the job the separate read server used to do.
zotero-core-mcp = "zotero_core.interfaces.mcp_server:run"

[dependency-groups]
# PEP 735 rather than extras: `--extra mcp` is a runtime capability a consumer opts
# into, while nobody consuming this package wants a type checker.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty==0.0.55",  # PINNED EXACTLY: ty is pre-1.0 (0.0.x) and its diagnostics change
                   # between releases, so an unpinned bump turns `just lint` red with
                   # no code change. Same pin as omni-rag and the other siblings.
    "import-linter>=2.9",
    "vulture>=2.14",
    "codespell>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Same rule set as calibre-core and the rest of Adam's Python: pycodestyle + pyflakes,
# import order, bugbear, pyupgrade, complexity ceiling.
select = ["E", "F", "I", "B", "UP", "C901", "TID"]

# Absolute imports only, matching `omni-rag` (which sets the same rule). This is not
# style: the Phase-2 move shifted seven modules one directory deeper, and every
# `from ..domain import` in them kept parsing while silently meaning something new.
# An absolute path breaks loudly at the moment a file moves, which is when you want it.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# `from .conftest import` is pytest's own co-location idiom -- conftest is DEFINED by
# sitting beside its tests, so the "this breaks when the file moves" rationale above
# does not apply. Exempted here rather than rewritten to keep pytest's collection intact.
"tests/**" = ["TID252"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_core"]
