[project]
name = "zotero-core"
version = "0.4.0"
description = "The one place that knows what a local Zotero library is: gated CRUD over a read layer that owns every Zotero SQL query."
requires-python = ">=3.10"
# Still zero. The sqlite adapters are stdlib sqlite3; both write transports are stdlib
# urllib + json. That is load-bearing, not incidental: `omni-rag` imports the read path
# inside its ARC entrypoints, so an async runtime pulled in by a tag verb is a real cost.
dependencies = []

[project.optional-dependencies]
mcp = [
  # <2 deliberately. mcp 2.0.0 is a different API: no `@server.list_tools()` decorator
  # and no `mcp.server.fastmcp`. Both adapters target 1.x; an unpinned `>=1.0.0` resolves
  # 2.0.0 and crashes the server at import. calibre-mcp pins the same way for the same
  # reason. Revisit only by porting both adapters.
  "mcp>=1.26.0,<2",
]

[project.scripts]
zotero-core = "zotero_core.interfaces.cli:main"
# ONE server: reads, gated writes and paper saving. `--read-only` serves the reads alone,
# for a context that must not write.
zotero-core-mcp = "zotero_core.interfaces.mcp_server:run"

[dependency-groups]
# PEP 735 rather than extras: `--extra mcp` is a runtime capability a consumer opts
# into, while nobody consuming this package wants a type checker.
dev = [
    "pytest>=8",
    # Exact pins: a float turns the gate red with no code change. The ruff pin equals the
    # ruff-pre-commit `rev` in .pre-commit-config.yaml; bump the two together.
    "ruff==0.17.2",
    "ty==0.0.88",
    "import-linter>=2.9",
    "vulture>=2.14",
    "codespell>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# The fleet base rules (E F W I B UP C4 C901 TID252), plus the rest of TID.
select = ["E", "F", "W", "I", "B", "UP", "C4", "C901", "TID", "TID252"]

# Absolute imports only, matching `omni-rag` (which sets the same rule). This is not
# style: the Phase-2 move shifted seven modules one directory deeper, and every
# `from ..domain import` in them kept parsing while silently meaning something new.
# An absolute path breaks loudly at the moment a file moves, which is when you want it.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# `from .conftest import` is pytest's own co-location idiom -- conftest is DEFINED by
# sitting beside its tests, so the "this breaks when the file moves" rationale above
# does not apply. Exempted here rather than rewritten to keep pytest's collection intact.
"tests/**" = ["TID252"]

[tool.ruff.lint.isort]
known-first-party = ["zotero_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_core"]
